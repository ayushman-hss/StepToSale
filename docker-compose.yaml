services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: footfall
      POSTGRES_PASSWORD: footfall
      POSTGRES_DB: footfall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footfall"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: